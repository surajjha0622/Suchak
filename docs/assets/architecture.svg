<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Suchak / VEGA system architecture</title>
  <desc id="d">Sensor nodes send LoRa packets to a zone gateway that runs local risk logic and syncs to a regional dashboard. Zone gateways share risk with downstream zones.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0B3C5D"/>
    </marker>
  </defs>
  <rect width="960" height="440" fill="#F4F8FB"/>

  <!-- Zone A -->
  <rect x="20" y="20" width="560" height="380" rx="14" fill="#FFFFFF" stroke="#9DB7C9" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="40" y="48" font-size="16" font-weight="700" fill="#0B3C5D">ZONE (upstream)</text>

  <!-- nodes -->
  <g font-size="13" fill="#0B3C5D">
    <rect x="44" y="76" width="150" height="76" rx="10" fill="#D6EBF7" stroke="#1C7293" stroke-width="2"/>
    <text x="119" y="102" text-anchor="middle" font-weight="700">Sensor node</text>
    <text x="119" y="120" text-anchor="middle">Rain gauge</text>
    <text x="119" y="136" text-anchor="middle">Water level</text>

    <rect x="44" y="172" width="150" height="76" rx="10" fill="#D6EBF7" stroke="#1C7293" stroke-width="2"/>
    <text x="119" y="198" text-anchor="middle" font-weight="700">Sensor node</text>
    <text x="119" y="216" text-anchor="middle">ESP32 + RTC</text>
    <text x="119" y="232" text-anchor="middle">Solar + LiFePO4</text>

    <rect x="44" y="268" width="150" height="76" rx="10" fill="#FFFFFF" stroke="#1C7293" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="119" y="294" text-anchor="middle" font-weight="700">Modular node</text>
    <text x="119" y="312" text-anchor="middle">smoke / air / heat /</text>
    <text x="119" y="328" text-anchor="middle">gas / soil / vibration</text>
  </g>

  <!-- gateway -->
  <rect x="330" y="120" width="220" height="150" rx="12" fill="#0B3C5D"/>
  <g font-size="13" fill="#FFFFFF">
    <text x="440" y="148" text-anchor="middle" font-size="15" font-weight="700">Zone gateway</text>
    <text x="440" y="174" text-anchor="middle">Data-quality checks</text>
    <text x="440" y="192" text-anchor="middle">Rate of rise + risk logic</text>
    <text x="440" y="210" text-anchor="middle">Edge AI (proposed)</text>
    <text x="440" y="228" text-anchor="middle">Local buffer + siren</text>
    <text x="440" y="252" text-anchor="middle" fill="#9FD3EA">works offline</text>
  </g>

  <!-- lora arrows -->
  <g stroke="#0B3C5D" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M194 114 C 260 114, 270 160, 328 170"/>
    <path d="M194 210 L 328 200"/>
    <path d="M194 306 C 260 306, 270 250, 328 230" stroke-dasharray="5 4"/>
  </g>
  <text x="214" y="104" font-size="12" font-weight="700" fill="#1C7293">LoRa</text>

  <!-- dashboard -->
  <rect x="640" y="76" width="300" height="104" rx="12" fill="#D6EBF7" stroke="#1C7293" stroke-width="2"/>
  <g font-size="13" fill="#0B3C5D">
    <text x="790" y="104" text-anchor="middle" font-size="15" font-weight="700">Regional backend</text>
    <text x="790" y="126" text-anchor="middle">FastAPI + PostgreSQL / TimescaleDB</text>
    <text x="790" y="146" text-anchor="middle">QGIS / zone risk map</text>
    <text x="790" y="166" text-anchor="middle">Authority + public dashboards</text>
  </g>
  <path d="M550 170 C 600 170, 600 140, 638 140" stroke="#0B3C5D" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="560" y="196" font-size="12" fill="#1C7293" font-weight="700">alerts + summaries</text>
  <text x="560" y="212" font-size="12" fill="#1C7293">(sync when online)</text>

  <!-- downstream -->
  <rect x="640" y="236" width="300" height="104" rx="12" fill="#FFFFFF" stroke="#9DB7C9" stroke-width="2" stroke-dasharray="8 6"/>
  <g font-size="13" fill="#0B3C5D">
    <text x="790" y="264" text-anchor="middle" font-size="15" font-weight="700">Downstream zone gateway</text>
    <text x="790" y="288" text-anchor="middle">receives upstream risk</text>
    <text x="790" y="308" text-anchor="middle">raises its own sampling rate</text>
    <text x="790" y="328" text-anchor="middle">and local alert readiness</text>
  </g>
  <path d="M550 240 C 600 250, 600 280, 638 288" stroke="#0B3C5D" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="556" y="308" font-size="12" fill="#1C7293" font-weight="700">upstream</text>
  <text x="556" y="324" font-size="12" fill="#1C7293" font-weight="700">risk (LoRa)</text>

  <text x="20" y="424" font-size="12" fill="#4A6A80">Flood (rainfall + water level) is the current prototype. Dashed = modular extensions. Edge AI is proposed; local risk logic comes first.</text>
</svg>
