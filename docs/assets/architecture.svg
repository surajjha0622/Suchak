<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Suchak flood early-warning system architecture</title>
  <desc id="d">Sensor and camera nodes send processed LoRa packets to a zone gateway that fuses rainfall, water level, vibration and camera results into a local risk level, drives sirens and the authorities dashboard, shares risk with the downstream zone, and syncs to a backend with a public dashboard when online.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0B3C5D"/>
    </marker>
  </defs>
  <rect width="960" height="460" fill="#F4F8FB"/>

  <!-- Zone -->
  <rect x="20" y="20" width="600" height="390" rx="14" fill="#FFFFFF" stroke="#9DB7C9" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="40" y="48" font-size="16" font-weight="700" fill="#0B3C5D">ZONE (upstream)</text>

  <g font-size="13" fill="#0B3C5D">
    <rect x="44" y="70" width="170" height="78" rx="10" fill="#D6EBF7" stroke="#1C7293" stroke-width="2"/>
    <text x="129" y="94" text-anchor="middle" font-weight="700">Sensor node</text>
    <text x="129" y="112" text-anchor="middle">Rain gauge + water level</text>
    <text x="129" y="130" text-anchor="middle">ESP32 + RTC + SX1262</text>

    <rect x="44" y="164" width="170" height="78" rx="10" fill="#D6EBF7" stroke="#1C7293" stroke-width="2"/>
    <text x="129" y="188" text-anchor="middle" font-weight="700">Vibration node</text>
    <text x="129" y="206" text-anchor="middle">ADXL345 frequency</text>
    <text x="129" y="224" text-anchor="middle">flash-flood signature</text>

    <rect x="44" y="258" width="170" height="78" rx="10" fill="#D6EBF7" stroke="#1C7293" stroke-width="2"/>
    <text x="129" y="282" text-anchor="middle" font-weight="700">Camera node</text>
    <text x="129" y="300" text-anchor="middle">on-node detection</text>
    <text x="129" y="318" text-anchor="middle">result + confidence only</text>

    <text x="129" y="362" text-anchor="middle" fill="#4A6A80">Solar + LiFePO4, deep sleep</text>
    <text x="129" y="380" text-anchor="middle" fill="#4A6A80">Never raw video over LoRa</text>
  </g>

  <!-- Gateway -->
  <rect x="340" y="90" width="250" height="250" rx="12" fill="#0B3C5D"/>
  <g font-size="13" fill="#FFFFFF">
    <text x="465" y="118" text-anchor="middle" font-size="15" font-weight="700">Zone gateway</text>
    <text x="465" y="140" text-anchor="middle" fill="#9FD3EA">Pi 5 / Jetson Nano</text>
    <text x="465" y="168" text-anchor="middle">Data checks + rate of rise</text>
    <text x="465" y="188" text-anchor="middle">Fuse rain + level +</text>
    <text x="465" y="206" text-anchor="middle">vibration + camera</text>
    <text x="465" y="226" text-anchor="middle">High / medium / low confidence</text>
    <text x="465" y="246" text-anchor="middle">Local risk level</text>
    <text x="465" y="266" text-anchor="middle">Adaptive sampling</text>
    <text x="465" y="286" text-anchor="middle">Local buffer + sync</text>
    <text x="465" y="318" text-anchor="middle" fill="#9FD3EA">works offline</text>
  </g>

  <g stroke="#0B3C5D" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M214 109 C 280 109, 290 160, 338 170"/>
    <path d="M214 203 L 338 215"/>
    <path d="M214 297 C 280 297, 290 260, 338 250"/>
  </g>
  <text x="232" y="98" font-size="12" font-weight="700" fill="#1C7293">LoRa</text>

  <!-- Local outputs -->
  <rect x="340" y="352" width="250" height="44" rx="10" fill="#FDE8E4" stroke="#C0392B" stroke-width="2"/>
  <text x="465" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#8E2B20">Siren + authorities local dashboard</text>
  <text x="465" y="388" text-anchor="middle" font-size="12" fill="#8E2B20">only on agreeing, high-confidence risk</text>
  <path d="M465 340 L 465 350" stroke="#0B3C5D" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- Backend -->
  <rect x="660" y="56" width="280" height="110" rx="12" fill="#D6EBF7" stroke="#1C7293" stroke-width="2"/>
  <g font-size="13" fill="#0B3C5D">
    <text x="800" y="82" text-anchor="middle" font-size="15" font-weight="700">Backend</text>
    <text x="800" y="104" text-anchor="middle">FastAPI + PostgreSQL / TimescaleDB</text>
    <text x="800" y="124" text-anchor="middle">QGIS / zone risk map</text>
    <text x="800" y="144" text-anchor="middle">Public web dashboard</text>
  </g>
  <path d="M590 150 C 625 150, 625 120, 658 120" stroke="#0B3C5D" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="598" y="178" font-size="12" font-weight="700" fill="#1C7293">sync when online</text>

  <!-- Downstream -->
  <rect x="660" y="230" width="280" height="110" rx="12" fill="#FFFFFF" stroke="#9DB7C9" stroke-width="2" stroke-dasharray="8 6"/>
  <g font-size="13" fill="#0B3C5D">
    <text x="800" y="256" text-anchor="middle" font-size="15" font-weight="700">Downstream zone gateway</text>
    <text x="800" y="280" text-anchor="middle">receives upstream alert</text>
    <text x="800" y="300" text-anchor="middle">checks more often</text>
    <text x="800" y="320" text-anchor="middle">passes confirmed risk on</text>
  </g>
  <path d="M590 250 C 625 255, 625 280, 658 285" stroke="#0B3C5D" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="598" y="310" font-size="12" font-weight="700" fill="#1C7293">upstream risk</text>
  <text x="598" y="326" font-size="12" font-weight="700" fill="#1C7293">(LoRa)</text>

  <text x="20" y="438" font-size="12" fill="#4A6A80">Rainfall + Level + Vibration + Camera → Rate of Rise → Local Risk → Downstream Warning → Local Action</text>
</svg>
